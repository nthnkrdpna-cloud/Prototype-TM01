# Como apoiar o projeto. Detalhes e a chave Pix em APOIO.md.
#
# `github:` fica em branco de proposito, ate a conta do GitHub Sponsors ser
# aprovada. Em branco, o botao nativo simplesmente nao aparece — que e melhor
# que apontar para um link que ainda nao existe.
#
# ⚠️ O QUE NUNCA ENTRA AQUI, e o motivo e concreto: o codigo Pix copia-e-cola
# (o "BR Code") NAO e so a chave. Ele e um payload EMV que carrega, em texto
# claro, o NOME CIVIL COMPLETO do recebedor, a CIDADE e o CEP — e carrega isso
# independentemente de a chave ser aleatoria ou nao. Colado num arquivo
# versionado, isso vira dado pessoal publico, indexado e permanente.
#
# So a chave aleatoria e publicada, e ela mora em APOIO.md.

github:
